
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Creeperminion Armory</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    main {
      width: 100%;
      height: 100dvh;
      display: grid;
      place-items: center;
    }

    .scene {
      width: min(100vw, 177.7778dvh);
      aspect-ratio: 16 / 9;
      background: url("assetsroom.png")
                  center / 100% 100% no-repeat;
    }
  </style>
</head>
<body>
  <main>
    <div class="scene"></div>
  </main>
</body>
</html>
