
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <title>Creeperminion Armory</title>
  <!-- This file is intentionally small. Edit appearance in style.css,
       behavior in script.js, and weapons/links in weapons.json. -->
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="stage">
    <div id="scene" aria-label="Interactive Phantom Forces armory">
      <!-- KEEP your existing background image in the repository root.
           If you rename it, change this src attribute. -->
      <img id="room" src="WebpageBG1.png" alt="Phantom Forces-style armory room" draggable="false">
      <!-- Dimming goes OVER the room but BEHIND the weapons. -->
      <div id="dimmer" aria-hidden="true"></div>
      <!-- script.js will create all the weapon buttons here. -->
      <div id="weapons-layer"></div>
    </div>
  </main>

  <!-- One popup is reused for all weapons and future clickable objects. -->
  <aside id="panel" hidden aria-label="Weapon resources" role="dialog" aria-modal="false" aria-labelledby="panel-title">
    <div class="panel-header">
      <div>
        <div class="eyebrow">PHANTOM FORCES / WEAPON INTEL</div>
        <h1 id="panel-title"></h1>
      </div>
      <button id="close" type="button" aria-label="Close panel">×</button>
    </div>
    <div class="section">VIDEOS</div>
    <div id="videos"></div>
    <div class="section">STATISTICS &amp; DOCUMENTS</div>
    <div id="stats"></div>
  </aside>
</body>
</html>
